<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Pet</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1022;
      --panel: rgba(18, 26, 55, 0.86);
      --ink: #edf4ff;
      --muted: #9cb0d1;
      --cyan: #5ee7ff;
      --pink: #ff73d1;
      --green: #7cffb2;
      --yellow: #ffe27a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 20%, rgba(94, 231, 255, 0.22), transparent 34%),
        radial-gradient(circle at 80% 10%, rgba(255, 115, 209, 0.18), transparent 30%),
        linear-gradient(135deg, #060812 0%, var(--bg) 55%, #161029 100%);
    }

    .stars,
    .stars::before,
    .stars::after {
      position: fixed;
      inset: 0;
      content: "";
      background-image:
        radial-gradient(#ffffff 1px, transparent 1px),
        radial-gradient(#9bf4ff 1px, transparent 1px);
      background-size: 120px 120px, 180px 180px;
      background-position: 0 0, 40px 70px;
      opacity: 0.22;
      animation: drift 18s linear infinite;
    }

    .stars::before { animation-duration: 28s; opacity: 0.14; transform: scale(1.5); }
    .stars::after { animation-duration: 38s; opacity: 0.1; transform: scale(2); }

    .card {
      position: relative;
      z-index: 1;
      width: min(92vw, 580px);
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 32px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 8vw, 4.2rem);
      letter-spacing: -0.06em;
      line-height: 0.95;
    }

    .subtitle {
      margin: 0 auto 30px;
      max-width: 36rem;
      color: var(--muted);
      font-size: 1.04rem;
    }

    .habitat {
      position: relative;
      min-height: 280px;
      display: grid;
      place-items: end center;
      margin: 12px 0 26px;
      border-radius: 28px;
      background:
        linear-gradient(transparent 55%, rgba(124, 255, 178, 0.08)),
        radial-gradient(ellipse at center bottom, rgba(94, 231, 255, 0.22), transparent 60%);
      overflow: hidden;
    }

    .speech {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      min-width: 210px;
      padding: 12px 16px;
      border-radius: 20px 20px 20px 6px;
      color: #10172f;
      background: #f7fbff;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      font-weight: 800;
    }

    .pet {
      position: relative;
      width: 230px;
      height: 210px;
      animation: bob 2.8s ease-in-out infinite;
      cursor: pointer;
      filter: drop-shadow(0 24px 26px rgba(0, 0, 0, 0.34));
    }

    .ear {
      position: absolute;
      top: 6px;
      width: 72px;
      height: 82px;
      border: 5px solid #17213d;
      background: linear-gradient(145deg, var(--cyan), #7f8cff);
      border-radius: 28px 28px 18px 28px;
    }

    .ear.left { left: 32px; transform: rotate(-23deg); }
    .ear.right { right: 32px; transform: rotate(23deg) scaleX(-1); }

    .face {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 198px;
      height: 174px;
      transform: translateX(-50%);
      border: 5px solid #17213d;
      border-radius: 48% 48% 42% 42%;
      background: linear-gradient(160deg, #5ee7ff 0%, #8b77ff 56%, #ff73d1 100%);
      overflow: hidden;
    }

    .face::before {
      position: absolute;
      inset: 18px;
      content: "";
      border-radius: 44% 44% 40% 40%;
      background: rgba(255, 255, 255, 0.2);
    }

    .eye {
      position: absolute;
      top: 72px;
      width: 32px;
      height: 42px;
      border-radius: 50%;
      background: #091025;
      animation: blink 5s infinite;
    }

    .eye::after {
      position: absolute;
      top: 8px;
      left: 9px;
      width: 9px;
      height: 12px;
      content: "";
      border-radius: 50%;
      background: white;
    }

    .eye.left { left: 48px; }
    .eye.right { right: 48px; }

    .snout {
      position: absolute;
      left: 50%;
      top: 112px;
      width: 72px;
      height: 42px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.58);
    }

    .nose {
      position: absolute;
      left: 50%;
      top: 6px;
      width: 18px;
      height: 13px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #17213d;
    }

    .mouth {
      position: absolute;
      left: 50%;
      top: 21px;
      width: 32px;
      height: 14px;
      transform: translateX(-50%);
      border-bottom: 4px solid #17213d;
      border-radius: 0 0 24px 24px;
    }

    .antenna {
      position: absolute;
      left: 50%;
      top: -24px;
      width: 6px;
      height: 42px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: var(--green);
    }

    .antenna::before {
      position: absolute;
      top: -17px;
      left: 50%;
      width: 24px;
      height: 24px;
      content: "</>";
      display: grid;
      place-items: center;
      transform: translateX(-50%);
      border: 3px solid #17213d;
      border-radius: 50%;
      color: #17213d;
      background: var(--yellow);
      font-size: 0.56rem;
      font-weight: 1000;
    }

    .paws {
      position: absolute;
      right: 8px;
      bottom: 26px;
      left: 8px;
      display: flex;
      justify-content: space-between;
    }

    .paw {
      width: 48px;
      height: 34px;
      border: 4px solid #17213d;
      border-radius: 50%;
      background: #ffbef0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      color: #071022;
      background: var(--green);
      box-shadow: 0 8px 18px rgba(124, 255, 178, 0.24);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    button:nth-child(2) { background: var(--cyan); }
    button:nth-child(3) { background: var(--pink); }
    button:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.05); }

    .status {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 22px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .meter {
      height: 9px;
      margin-top: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
    }

    .meter span {
      display: block;
      width: var(--value);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--green));
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-14px) rotate(1deg); }
    }

    @keyframes blink {
      0%, 94%, 100% { transform: scaleY(1); }
      96%, 98% { transform: scaleY(0.08); }
    }

    @keyframes drift {
      to { transform: translate3d(-120px, 120px, 0); }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main class="card">
    <h1>Codex Pet</h1>
    <p class="subtitle">Meet Byte, your tiny AI companion. Feed it bugs, teach it snippets, and give it a refactor cuddle.</p>

    <section class="habitat" aria-label="Byte the Codex pet habitat">
      <div class="speech" id="speech">Ready to pair program!</div>
      <div class="pet" id="pet" role="img" aria-label="A cheerful neon coding pet named Byte">
        <div class="antenna"></div>
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="snout"><div class="nose"></div><div class="mouth"></div></div>
          <div class="paws"><div class="paw"></div><div class="paw"></div></div>
        </div>
      </div>
    </section>

    <div class="controls" aria-label="Pet actions">
      <button data-action="bug">Feed a bug</button>
      <button data-action="snippet">Teach snippet</button>
      <button data-action="cuddle">Refactor cuddle</button>
    </div>

    <div class="status" aria-label="Byte status meters">
      <div>Energy<div class="meter"><span id="energy" style="--value: 76%"></span></div></div>
      <div>Logic<div class="meter"><span id="logic" style="--value: 62%"></span></div></div>
      <div>Joy<div class="meter"><span id="joy" style="--value: 91%"></span></div></div>
    </div>
  </main>

  <script>
    const speech = document.querySelector('#speech');
    const pet = document.querySelector('#pet');
    const meters = {
      energy: document.querySelector('#energy'),
      logic: document.querySelector('#logic'),
      joy: document.querySelector('#joy'),
    };
    const state = { energy: 76, logic: 62, joy: 91 };
    const reactions = {
      bug: ['Crunch! That bug is now a feature.', { energy: 8, logic: 3, joy: 2 }],
      snippet: ['New trick learned: semantic tail wag.', { energy: -4, logic: 12, joy: 5 }],
      cuddle: ['Refactored into maximum coziness.', { energy: 3, logic: 1, joy: 10 }],
      boop: ['Boop accepted. Tests are purring.', { energy: 1, logic: 1, joy: 4 }],
    };

    function update(action) {
      const [message, delta] = reactions[action];
      Object.entries(delta).forEach(([key, value]) => {
        state[key] = Math.max(0, Math.min(100, state[key] + value));
        meters[key].style.setProperty('--value', `${state[key]}%`);
      });
      speech.textContent = message;
      pet.animate([
        { transform: 'translateY(0) scale(1)' },
        { transform: 'translateY(-22px) scale(1.08)' },
        { transform: 'translateY(0) scale(1)' },
      ], { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }

    document.querySelectorAll('button').forEach((button) => {
      button.addEventListener('click', () => update(button.dataset.action));
    });
    pet.addEventListener('click', () => update('boop'));
  </script>
</body>
</html>
